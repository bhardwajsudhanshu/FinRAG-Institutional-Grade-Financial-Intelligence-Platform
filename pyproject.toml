[project]
name = "finrag"
version = "0.1.0"
description = "FinRAG — Institutional-Grade Financial Intelligence Platform (RAG over SEC filings)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "FinRAG contributor" }]
license = { text = "MIT" }

# Core dependencies
dependencies = [
    # Config
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    # Data / parsing
    "sec-edgar-api>=0.1.0",
    # sec-parser requires lxml which fails to build on Windows without MSVC.
    # We use a stdlib regex parser instead (see finrag/data/parse_sections.py).
    # Revisit on Linux/macOS or after installing MSVC build tools.
    # "sec-parser>=0.1.0",
    "beautifulsoup4>=4.12",
    # lxml is faster but requires MSVC build tools on Windows. BeautifulSoup's
    # built-in html.parser works fine for our use case and is stdlib-only.
    # "lxml>=5.0",  # uncomment on Linux/macOS or after installing MSVC build tools
    "tiktoken>=0.7",
    "pyarrow>=15.0",
    "pandas>=2.2",
    # Embeddings / vector
    "chromadb>=0.5",
    # Google Vertex (only loaded when EMBEDDER_BACKEND=vertex or GENERATOR_BACKEND=vertex)
    "google-cloud-aiplatform>=1.60",
    # Retrieval
    "rank-bm25>=0.2.2",
    "nltk>=3.8",
    # CLI / output
    "typer>=0.12",
    "rich>=13.7",
    # Reliability
    "tenacity>=8.2",
    "httpx>=0.27",
    "cachetools>=5.3",
    # Logging
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "ipython>=8.20",
]
# Evaluation gets its own extra so we don't pull ragas into every run
eval = [
    "ragas>=0.1.0",
    "datasets>=2.18",
]
# Optional vector DBs (docker-compose runs them, but Python clients are optional)
vectordbs = [
    "qdrant-client>=1.8",
    "weaviate-client>=4.5",
]

[project.scripts]
finrag = "finrag.cli.main:app"

# ---- uv configuration: keep cache on F: drive ----
# python-install-dir is set via env var UV_PYTHON_INSTALL_DIR=F:/.uv-python
# (documented in docs/01_setup.md). The pyproject field of the same name
# doesn't exist in this uv version, so we set it in the shell.
[tool.uv]
# Cache goes to F:/.uv-cache (created during setup)
cache-dir = "F:/.uv-cache"

# ---- Tooling configuration --------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"

# ---- Build system -----------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finrag"]
