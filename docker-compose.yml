# FinRAG — local dev infrastructure
# Run: docker compose up -d
# This brings up: Qdrant, Weaviate, Redis, Postgres.
# ChromaDB runs in-process (no docker needed).
# Vertex AI Vector Search runs on GCP (no local docker).
#
# NOTE on C: drive usage: Docker Desktop's image storage is on C: by default.
# If you want to move it to F:, do it once in Docker Desktop → Settings → Resources
# → Advanced → "Disk image location". We don't touch that system setting here.

services:
  qdrant:
    image: qdrant/qdrant:v1.10.0
    container_name: finrag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

  weaviate:
    # Pinned to 1.27.x: weaviate-client 4.23 refuses servers < 1.27.0
    # (STEP_017: compose shipped 1.25.5, client rejected it at connect).
    image: semitechnologies/weaviate:1.27.7
    container_name: finrag-weaviate
    ports:
      - "8080:8080"
      # v4 clients ALSO need gRPC (STEP_017: missing mapping broke connects).
      - "50051:50051"
    volumes:
      - weaviate_data:/var/lib/weaviate
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      # No modules: we use bring-your-own-vectors (vectorizer: none) so no
      # inference container is needed. (STEP_017: ENABLE_MODULES previously
      # named text2vec-transformers with no inference endpoint configured,
      # which crashed Weaviate at startup — fatal "modules didn't initialize".)
      ENABLE_MODULES: ""
      DEFAULT_VECTORIZER_MODULE: none
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: finrag-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: finrag-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: finrag
      POSTGRES_USER: finrag
      POSTGRES_PASSWORD: finrag
    restart: unless-stopped

volumes:
  qdrant_data:
  weaviate_data:
  redis_data:
  postgres_data:
