exp_name: exp_031_minilm_rerank
description: Local MiniLM cross-encoder re-rank (top-10 -> top-5) over hybrid retrieval. Cost/latency challenger to Flash rerank.

chunker:
  type: naive_fixed
  size: 512
  overlap: 50
  tokenizer: cl100k_base

embedder:
  backend: vertex
  model: text-embedding-005
  dim: 768

retrieval:
  strategy: hybrid
  dense_top_k: 20
  bm25_top_k: 20
  rrf_k: 60
  fetch_top_k: 10

rerank:
  backend: cross-encoder
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  device: cpu
  text_truncation_chars: 2000
  candidates: 10
  final_top_k: 5
  scoring_cost_usd: 0.0

generator:
  backend: vertex
  model: gemini-2.5-flash
  temperature: 0.0

ragas_judge:
  llm: gemini-2.5-flash
  embeddings: text-embedding-005

eval_set:
  path: data/eval/qa_pairs.jsonl
  version: v1
  n_questions: 139
  n_filings: 20
