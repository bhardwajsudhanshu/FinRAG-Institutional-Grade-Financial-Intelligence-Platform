exp_name: exp_001_naive_baseline
description: Naive baseline pipeline. Fixed 512-token chunks, dense retrieval, Flash generation. The floor every other experiment must beat.

chunker:
  type: naive_fixed
  size: 512
  overlap: 50
  tokenizer: cl100k_base  # tiktoken

embedder:
  backend: vertex
  model: text-embedding-005
  dim: 768

retrieval:
  backend: in_memory
  metric: cosine
  top_k: 5

generator:
  backend: vertex
  model: gemini-2.5-flash
  temperature: 0.0

ragas_judge:
  llm: gemini-2.5-flash
  embeddings: text-embedding-005

eval_set:
  path: data/eval/qa_pairs.jsonl
  version: v1
  n_questions: 139
  n_filings: 20
